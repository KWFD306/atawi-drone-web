{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="glass-card p-12 w-full max-w-md shadow-2xl">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold mb-2">Bon retour</h1>
            <p class="text-gray-500">Connectez-vous pour piloter votre USV</p>
        </div>
        
        <form method="POST">
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                <input type="email" name="email" required class="w-full px-6 py-4 rounded-2xl bg-white border border-gray-100 focus:border-black focus:ring-0 outline-none transition-all" placeholder="votre@email.com">
            </div>
            <div class="mb-8">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Mot de passe</label>
                <input type="password" name="password" required class="w-full px-6 py-4 rounded-2xl bg-white border border-gray-100 focus:border-black focus:ring-0 outline-none transition-all" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-black text-white py-4 rounded-2xl font-bold hover:bg-gray-800 transition-all shadow-lg mb-6">Se connecter</button>
        </form>
        
        <p class="text-center text-gray-500">
            Pas encore de compte ? 
            <a href="{{ url_for('auth.register') }}" class="text-black font-bold hover:underline">S'inscrire</a>
        </p>
    </div>
</div>
{% endblock %}
